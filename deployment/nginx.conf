server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location /api/ {
        default_type application/json;
        return 503 '{"error":"Simulation deployment: Flask API is not configured."}';
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
