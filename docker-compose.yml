services:
  workbench:
    depends_on:
      backend:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      LAB_ALLOW_HARDWARE: "${LAB_ALLOW_HARDWARE:-false}"
      LAB_API_TOKEN: "${LAB_API_TOKEN:-}"
    volumes:
      - lab-data:/data
    restart: unless-stopped
volumes:
  lab-data:
