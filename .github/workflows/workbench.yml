name: Workbench checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LAB_ALLOW_HARDWARE: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.1'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=../work/ci/backend.xml tests/workbench
      - run: python -m black --check .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-junit
          path: work/ci/backend.xml

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.1'
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: |
          mkdir -p ../work/ci
          node --test --test-reporter=junit --test-reporter-destination=../work/ci/frontend.xml tests/simulator.test.cjs
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: frontend-junit
          path: work/ci/frontend.xml

  compiled-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      LAB_MQTT_PORT: '0'
      LAB_HTTP_PORT: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Start the synthetic controller
        run: |
          docker compose -p uisee-ci -f docker-compose.yml \
            -f deployment/firmware-fixtures/uisee-controller/compose.yml \
            up --build --detach --wait --wait-timeout 120 compiled-controller
      - name: Verify the compiled handler over the Workbench protocol
        run: |
          mkdir -p work/ci
          docker compose -p uisee-ci -f docker-compose.yml \
            -f deployment/firmware-fixtures/uisee-controller/compose.yml \
            exec -T compiled-controller python smoke.py > work/ci/compiled-controller.json
          docker compose -p uisee-ci -f docker-compose.yml \
            -f deployment/firmware-fixtures/uisee-controller/compose.yml \
            exec -T compiled-controller cat /app/bin/controller-elf.txt > work/ci/controller-elf.txt
      - name: Capture and clean up the disposable stack
        if: always()
        run: |
          mkdir -p work/ci
          docker compose -p uisee-ci -f docker-compose.yml \
            -f deployment/firmware-fixtures/uisee-controller/compose.yml \
            logs --no-color > work/ci/compiled-controller.log
          docker compose -p uisee-ci -f docker-compose.yml \
            -f deployment/firmware-fixtures/uisee-controller/compose.yml down --volumes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: compiled-controller-evidence
          path: work/ci/
